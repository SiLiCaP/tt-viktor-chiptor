# Tiny Tapeout project information
project:
  title:        "Viktor Chiptor"      # Project title
  author:       "Marks Hansons"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "ML-KEM (FIPS 203) NTT coprocessor (work in progress)"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ntt_engine"  # placeholder name, may change

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "io_in_capture.v"
    - "io_out_pack.v"
    - "ntt_core.v"
    - "zeta_rom.v"
    - "modq_mul.v"
    - "modq_addsub.v"
    - "modq_acc.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "din[0]"
  ui[1]: "din[1]"
  ui[2]: "din[2]"
  ui[3]: "din[3]"
  ui[4]: "din[4]"
  ui[5]: "din[5]"
  ui[6]: "din[6]"
  ui[7]: "din[7]"

  # Outputs
  uo[0]: "result byte bit 0"
  uo[1]: "result byte bit 1"
  uo[2]: "result byte bit 2"
  uo[3]: "result byte bit 3"
  uo[4]: "result byte bit 4"
  uo[5]: "result byte bit 5"
  uo[6]: "result byte bit 6"
  uo[7]: "result byte bit 7"

  # Bidirectional pins
  uio[0]: "din[8]"
  uio[1]: "din[9]"
  uio[2]: "din[10]"
  uio[3]: "din[11]"
  uio[4]: "valid"
  uio[5]: "sof"
  uio[6]: "op[0]"
  uio[7]: "op[1]"

# Do not change!
yaml_version: 6
